name: gatehouse
services:
  gatehouse:
    depends_on:
      storage-init:
        condition: service_completed_successfully
    build: .
    image: gatehouse:local
    restart: unless-stopped
    # Linux host mode preserves the source IP for access policies.
    network_mode: host
    volumes:
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/config:/config
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/log:/log
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/data:/data
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/sunpanel:/sunpanel
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  storage-init:
    image: gatehouse:local
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /config /log /data /sunpanel && chmod 700 /config /log /data /sunpanel"]
    volumes:
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/config:/config
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/log:/log
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/data:/data
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/sunpanel:/sunpanel
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
