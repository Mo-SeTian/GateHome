name: Publish GateHome
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: gatehome-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          pattern = r'(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})(?:-beta\.[1-9][0-9]{0,5})?'
          assert re.fullmatch(pattern, version), 'Invalid release version'
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match VERSION'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
              output.write('prerelease=' + str('-beta.' in version).lower() + '\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build embedded frontends
        run: make frontend
      - name: Verify code and installer
        run: |
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 make -o frontend build
          python3 scripts/install_checks.py
          for check in frontend motion dashboard security discovery image online_update account backup_frontend mcp_frontend sunpanel ui; do
            node "scripts/${check}_checks.mjs"
          done
      - name: Package release
        run: |
          make -o frontend release
          cd 更新版本
          sha256sum -c gatehome-SHA256SUMS
      - name: Upload, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(
            更新版本/gatehome-linux-amd64.tar.gz
            更新版本/gatehome-linux-arm64.tar.gz
            更新版本/gatehome-SHA256SUMS
            "更新版本/gatehouse-$RELEASE_VERSION-update.zip"
          )
          target_commit=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$target_commit"
          find_release() {
            gh api --paginate -H 'Cache-Control: no-cache' "repos/$GH_REPO/releases?per_page=100" |
              jq -cs --arg tag "$RELEASE_TAG" '
                map(.[]) | map(select(.tag_name == $tag or
                  (.draft == true and .name == ("GateHome " + $tag) and (.tag_name | startswith("untagged-"))))) |
                if length > 1 then error("Duplicate release tag") else .[0] // null end
              '
          }
          metadata=$(find_release)
          if [ "$metadata" = null ]; then
            args=(--verify-tag --target "$target_commit" --draft --title "GateHome $RELEASE_TAG" --generate-notes)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
            for attempt in {1..10}; do
              metadata=$(find_release)
              if [ "$metadata" != null ]; then break; fi
              sleep 1
            done
          fi
          release_id=$(jq -er --arg tag "$RELEASE_TAG" '
            select(.draft == true and
              (.tag_name == $tag or (.name == ("GateHome " + $tag) and (.tag_name | startswith("untagged-"))))) | .id
          ' <<< "$metadata")
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$RELEASE_TAG" \
            -F prerelease="$PRERELEASE" --silent
          metadata=$(gh api "repos/$GH_REPO/releases/$release_id")
          upload_url=$(jq -er '.upload_url | split("{")[0]' <<< "$metadata")
          test "$upload_url" = "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets"
          for source in "${assets[@]}"; do
            name=$(basename "$source")
            existing_id=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<< "$metadata")
            if [ -n "$existing_id" ]; then
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$existing_id"
            fi
            gh api --method POST "$upload_url?name=$name" --input "$source" \
              -H 'Content-Type: application/octet-stream' --silent
          done
          metadata=$(gh api "repos/$GH_REPO/releases/$release_id")
          mkdir -p "$RUNNER_TEMP/gatehome-release-assets"
          for source in "${assets[@]}"; do
            name=$(basename "$source")
            asset_id=$(jq -er --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded") | .id' <<< "$metadata")
            gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$asset_id" \
              > "$RUNNER_TEMP/gatehome-release-assets/$name"
          done
          cd "$RUNNER_TEMP/gatehome-release-assets"
          sha256sum -c gatehome-SHA256SUMS
          for source in "${assets[@]}"; do
            name=$(basename "$source")
            digest="sha256:$(sha256sum "$name" | cut -d' ' -f1)"
            jq -e --arg name "$name" --arg digest "$digest" --argjson size "$(stat -c%s "$name")" '
              [.assets[] | select(.name == $name)] |
              length == 1 and (.[0] | .state == "uploaded" and .digest == $digest and .size == $size)
            ' <<< "$metadata" > /dev/null
          done
          latest=true
          if [ "$PRERELEASE" = true ]; then latest=false; fi
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$RELEASE_TAG" \
            -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$latest" --jq '.html_url'
          gh api "repos/$GH_REPO/releases/$release_id" |
            jq -e --arg tag "$RELEASE_TAG" --argjson beta "$PRERELEASE" '(.tag_name == $tag) and (.draft == false) and (.prerelease == $beta)' > /dev/null
