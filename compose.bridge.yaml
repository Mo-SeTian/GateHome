# Standalone alternative: docker compose -f compose.bridge.yaml ...
name: gatehouse
services:
  gatehouse:
    depends_on:
      storage-init:
        condition: service_completed_successfully
    build: .
    image: gatehouse:local
    restart: unless-stopped
    command: ["-admin", "0.0.0.0:16666"]
    ports:
      - "16666:16666"
      - "18080:18080"
      - "18443:18443"
      # Match this container port to the port configured in GateHome.
      - "${SUNPANEL_PORT:-16680}:${SUNPANEL_PORT:-16680}"
    volumes:
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/config:/config
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/log:/log
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/data:/data
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/sunpanel:/sunpanel
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  storage-init:
    image: gatehouse:local
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /config /log /data /sunpanel && chmod 700 /config /log /data /sunpanel"]
    volumes:
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/config:/config
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/log:/log
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/data:/data
      - ${GATEHOME_RUNTIME_DIR:-./runtime}/sunpanel:/sunpanel
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
