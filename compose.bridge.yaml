# Standalone alternative: docker compose -f compose.bridge.yaml ...
name: gatehouse
services:
  gatehouse:
    depends_on:
      storage-init:
        condition: service_completed_successfully
    build: .
    image: gatehouse:local
    restart: unless-stopped
    command: ["-admin", "0.0.0.0:16666"]
    ports:
      - "16666:16666"
      - "18080:18080"
      - "18443:18443"
    volumes:
      - ./config:/config
      - ./log:/log
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  storage-init:
    image: gatehouse:local
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /config /log /data && chmod 700 /config /log /data"]
    volumes:
      - ./config:/config
      - ./log:/log
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
