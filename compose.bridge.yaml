# Standalone alternative: docker compose -f compose.bridge.yaml ...
name: gatehouse
services:
  gatehouse:
    build: .
    image: gatehouse:local
    restart: unless-stopped
    command: ["-admin", "0.0.0.0:16666"]
    ports:
      - "16666:16666"
      - "18080:18080"
      - "18443:18443"
    volumes:
      - gatehouse-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  gatehouse-data:
